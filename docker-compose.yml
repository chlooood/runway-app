# Local development database. Credentials are dev-only defaults that match
# backend/.env.example; override any of them with environment variables.
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-runway}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-runway}
      POSTGRES_DB: ${POSTGRES_DB:-runway}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql  # Postgres 18+ keeps data under this path
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
